# Attach the installers to every published release, so the one-line installs
# (releases/latest/download/install.sh and install.ps1) always fetch the
# installers that shipped with the newest release.

name: release-assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    name: attach installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Upload install.sh and install.ps1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" scripts/install.sh scripts/install.ps1 --clobber
