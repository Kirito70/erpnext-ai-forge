# erpnext-ai-forge — global configuration
# Version: 0.1.0
# Spec: ULTRAPLAN-AI-FRAMEWORK-v0.2.md

project:
  name: erpnext-ai-forge
  version: 0.1.0
  description: "Cross-tool AI agent standardization framework for the Novizna v16 ERPNext/Frappe bench"

# Target bench (resolved at sync time; can be overridden via FORGE_BENCH_PATH env var)
bench:
  path: "{{ env.FORGE_BENCH_PATH }}"
  primary_site: "{{ env.FORGE_PRIMARY_SITE }}"

  # Git remote owners we consider ours. An app whose remote points anywhere
  # else is "foreign": sync will not write into it without a typed yes, even
  # if someone has listed it under managed_apps. Ownership is read live from
  # `git remote get-url`, so it cannot drift out of date the way a hand-kept
  # list would.
  #
  # Empty or absent disables the check entirely.
  owned_remotes:
    - novizna-codes

  # Apps forge may write per-app instruction files into. Discovery finds every
  # custom app in the bench, but "custom to this bench" is not the same as
  # "ours to commit to", so per-app rendering is opt-in by name.
  #
  # Authoritative: an adapter's own `apps:` list only decides whether that
  # adapter does per-app files at all, not which ones.
  #
  # Manage with `forge apps add|remove <app>`. Removing a name stops future
  # syncs writing there; it does NOT delete a file already written — use
  # `forge apps remove <app> --prune` for that.
  managed_apps:
    - novizna_crm
    - novizna_core
    - novizna_pos
    - noviznaerp_payroll
    - erpnext_location
    - novizna_integrations

  # Apps the Python linter may see. Renders canonical/harness/ruff.toml.j2 into
  # the target's ruff.toml, excluding every app in the bench not named here.
  #
  # Wider than `managed_apps` on purpose: these are two different questions.
  # `managed_apps` is "does forge write instruction files here", which we keep
  # narrow; this is "is this app's Python ours to fix", which covers apps we
  # own but have not onboarded to forge yet.
  #
  # Deliberately its own list rather than derived:
  #   - from `owned_remotes`: the upstream apps are forks into our own org
  #     (frappe -> novizna_framework, erpnext -> noviznaerp,
  #     crm -> novizna_crm_core, hrms -> novizna_hrms,
  #     press -> novizna_press_core), so remote ownership calls all five ours.
  #   - from `upstream_apps`: that list is the write guard's and omits the
  #     third-party apps (raven, cargo_management, changemakers) we also never
  #     lint.
  #
  # An allow-list, so an app vendored in later is linted (noisy, prompts a
  # re-sync) rather than skipped (quiet, and nobody notices).
  lint_apps:
    - erpnext_location
    - invoice_ninja_integration
    - novizna_core
    - novizna_crm
    - novizna_hr_legal
    - novizna_integrations
    - novizna_pos
    - novizna_restaurant
    - noviznaerp_payroll

# Additional render targets, layered on top of `bench:` above.
#
# The forge repo generates the harness every other repo runs, and until now had
# none of its own. Hand-writing one would guarantee the two drift, so it is a
# target like any other: same canonical sources, same security gate, same
# hand-edit protection. What differs is the stack — this is a Python CLI, not a
# Frappe bench — and that difference is confined to `stack_profile`, which
# selects the gate table in canonical/harness/gates.yaml.
targets:
  self:
    root: "."                  # relative paths resolve against the forge repo
    stack_profile: python_cli
    self_target: true          # skips the foreign-write prompt; we are inside it
    # Only the tools that can act on this repo.
    enabled_tools:
      - claude-code
      - opencode
      - codex

    # Which artifact groups this target receives. Omit the key entirely and a
    # target gets everything — right for the bench, wrong here: the canonical
    # agents, skills and tools describe a Frappe bench, and rendering
    # `bench-migrate` or the ERPNext accounting skill into a Python CLI repo
    # would be actively misleading. `per_app_claude_md` is worse — with no
    # managed_apps to constrain it, it invents apps/ directories for the five
    # bench apps inside this repo.
    #
    # The harness, and only the harness. Same canonical scripts the bench gets;
    # the stack difference is confined to gates.yaml -> stacks.python_cli.
    renders:
      - harness_scripts
      - hook_wiring
      # The doc that explains the hooks. Safe here despite being an aggregate:
      # harness-and-gates.md.j2 reads only forge/target/profile, so it carries
      # no Frappe content. A repo with blocking hooks and nothing describing
      # them is how people end up disabling the hooks.
      - harness_doc
      # The reasoning protocol is stack-neutral and applies to work on this
      # repo as much as to the bench. Its Frappe-specific section is a table of
      # risks, which is context, not instruction.
      - operating_manual_doc

# Tools managed by `forge sync --all` (all 7 adapters enabled — Phase 3 complete)
enabled_tools:
  - claude-code        # Phase 1a/1b — primary target (subagent-capable)
  - cursor             # Phase 3 — full subagent-inlined rules + per-app globs
  - opencode           # Phase 3 — AGENTS.md aggregate + native slash commands
  - cline              # Phase 3 — .clinerules/ aggregate + per-app rules
  - copilot            # Phase 3 — .github/copilot-instructions.md + per-app applyTo
  - codex              # hooks + MCP only; Codex reads the shared AGENTS.md
  - antigravity        # Phase 3 — minimal system.md (re-scope per Decision 6)

# Security thresholds (tightened per v0.2 Decision 11 + Part B item 3)
security:
  auto_accept_threshold: 95         # ≥ 95 → auto-accept
  warn_threshold: 80                # 80–94 → warn, require typed justification
  block_threshold: 80               # < 80 → block sync
  external_skill_threshold: 98      # external/imported skills must clear ≥ 98
  require_typed_justification: true # 80–94 score forces developer to type one-line reason
  log_justifications_to_audit: true

# Audit logging (v0.2 Section 8.4 + Decision 14)
audit:
  enabled: true
  path: audit/
  rotation: daily
  retention_days: 365              # 1 year, local-only
  compress_after_days: 30
  backup:
    enabled: true
    cadence: monthly
    method: tar+gpg
    destination: "{{ env.FORGE_AUDIT_BACKUP_DIR }}"
    gpg_recipient: "{{ env.FORGE_AUDIT_GPG_RECIPIENT }}"

# Sync behaviour (v0.2 Section 3.5 + Part B item 7)
sync:
  staging_dir: .forge-staging
  transactional: true              # --all aborts if any adapter fails
  write_manifest: true             # .forge-manifest.json per output dir
  manifest_version: 1
  backup_claude_settings: true     # .claude/settings.json.forge-backup on every sync

# Verification harness — the mechanical enforcement layer.
#
# The scripts themselves are canonical (canonical/harness/), rendered per target
# like every other artifact. Two rules keep them from tripping over each other:
#
#   - Exactly ONE enabled adapter per target renders scripts/harness/, because
#     all seven would otherwise write the same paths and fight over the manifest.
#   - No hook ever invokes `forge sync`. A sync from inside a hook would rewrite
#     the scripts mid-run, and `_confirm_foreign_writes` fails closed on a
#     non-tty, so it would skip silently rather than ask. `forge validate`
#     greps the harness templates to enforce this.
harness:
  enabled: true
  owner_adapter: claude-code
  scripts_dir: scripts/harness     # target-relative

# Commit conventions (v0.2 Decision 20)
commits:
  enforce_conventional: true
  scopes:
    - scaffold
    - forge
    - agents
    - skills
    - commands
    - tools
    - adapters
    - discovery
    - audit
    - docs
    - ci
    - harness      # scripts/harness/* and the canonical/harness/ sources behind them
    - hooks        # per-tool hook wiring emitted by the adapters
    - ticketing    # ticket contract, ledger, gap loop
    - policies     # canonical/policies/*
  types: [feat, fix, refactor, chore, docs, test, perf, ci]

# Confirmation tokens (v0.2 Decision 13)
confirmations:
  destructive_token: "{{ bench.primary_site }}"   # type the site name, not "yes"

# Discovery (v0.2 Section 1 + Decision 15)
discovery:
  cadence: on_demand
  auto_trigger_on_stale_reference: true
  output_dir: discovery/

# Upstream-app guard (v0.2 Section 8.3 + Section 6.1)
upstream_apps:
  - frappe
  - erpnext
  - crm
  - hrms
  - lending
  - lms
  - education
  - helpdesk
  - gameplan
  - drive
  - press
guard_action: reject               # any write under apps/<upstream>/ → reject
