default: true
MD013: false   # line length — disabled for tables and code blocks
MD024: false   # duplicate headings — allowed across sections
MD033: false   # inline HTML — needed for diagrams and details blocks
MD041: false   # first line as h1 — frontmatter blocks the heading

# Frontmatter `title:` is metadata for forge and the ticket tooling — it is never
# rendered as a heading. Left at the default, markdownlint counts it as the
# document's h1 and then reports the real `# ...` heading as a second one.
MD025:
  front_matter_title: ""
